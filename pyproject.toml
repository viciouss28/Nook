[project]
name = "nook"
version = "0.1.0"
description = "A folder-specific CLI task manager"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.8",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.8",
    "typer>=0.27.3",
]

[project.scripts]
nook = "nook.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nook"]
